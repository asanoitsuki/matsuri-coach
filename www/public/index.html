<script>
// ════════════════════════════════════════════════════════════════
//  状態変数

let map, markerLayer;
let activeCategory = "全体";
let isLoggedIn = false;
let currentUser = null;
let likedIds = [];
let calendarIds = [];
let currentSelectedEvent = null;

const regionCenters = {
    "北海道・東北": [40.5, 141.0, 6],
    "関東":         [35.8, 139.7, 8],
    "中部":         [35.8, 137.5, 7],
    "近畿":         [34.7, 135.5, 8],
    "中国・四国":   [34.0, 133.0, 7],
    "九州・沖縄":   [31.5, 130.5, 7],
};

// ════════════════════════════════════════════════════════════════
//  Capacitorプラグインヘルパー
// ════════════════════════════════════════════════════════════════
function getPlugin(name) {
    return window.Capacitor?.Plugins?.[name] ?? null;
}

async function hapticImpact(style) {
    try {
        const H = getPlugin('Haptics');
        if (H) await H.impact({ style: style || 'Medium' });
    } catch (e) { /* webでは無視 */ }
}

async function hapticNotification(type) {
    try {
        const H = getPlugin('Haptics');
        if (H) await H.notification({ type: type || 'Success' });
    } catch (e) {}
}

async function scheduleLocalNotification(title, body) {
    try {
        const LN = getPlugin('LocalNotifications');
        if (!LN) return;
        // 通知権限をリクエスト
        const { display } = await LN.checkPermissions();
        if (display !== 'granted') {
            const result = await LN.requestPermissions();
            if (result.display !== 'granted') return;
        }
        await LN.schedule({
            notifications: [{
                id: Math.floor(Math.random() * 1000000),
                title: title,
                body: body,
                schedule: { at: new Date(Date.now() + 3000) }, // 3秒後に通知
                sound: null,
                smallIcon: 'ic_stat_icon_config_sample',
            }]
        });
    } catch (e) {
        console.log('LocalNotification error:', e);
    }
}

// ════════════════════════════════════════════════════════════════
//  Google Sign-In (Google Identity Services)
//  ※ 982642152853-sj2t98l3obh57gu7ftpadivtc3kdck46.apps.googleusercontent.com を実際のクライアントIDに差し替えること
// ════════════════════════════════════════════════════════════════
const GOOGLE_CLIENT_ID = '982642152853-sj2t98l3obh57gu7ftpadivtc3kdck46.apps.googleusercontent.com';

// ════════════════════════════════════════════════════════════════
//  クラウドデータ取得 URL
//  ▼ GitHubにプッシュ後、下のURLを自分のユーザー名/リポジトリ名に書き換える
//  例: "https://raw.githubusercontent.com/YourName/matsuri-navi/main/matsuri-data.json"
// ════════════════════════════════════════════════════════════════
const API_URL = "https://raw.githubusercontent.com/asanoitsuki/matsuri-coach/main/www/matsuri-data.json";

function initGoogleSignIn() {
    if (typeof google === 'undefined' || !google.accounts) {
        // GIS未ロードならフォールバックボタンを表示
        document.getElementById('fallbackGoogleBtn')?.classList.remove('hidden');
        return;
    }
    google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleCredential,
        auto_select: false,
        cancel_on_tap_outside: true,
    });
    // ログインモーダル内のボタンをレンダリング
    google.accounts.id.renderButton(
        document.getElementById('googleSignInBtn'),
        { theme: 'outline', size: 'large', width: 300, text: 'signin_with', shape: 'pill' }
    );
}

function handleGoogleCredential(response) {
    try {
        // JWT の payload 部分を Base64デコードしてユーザー情報を取得
        const base64 = response.credential.split('.')[1]
            .replace(/-/g, '+').replace(/_/g, '/');
        const payload = JSON.parse(decodeURIComponent(
            atob(base64).split('').map(c =>
                '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
            ).join('')
        ));
        onGoogleLoginSuccess({
            name: payload.name,
            email: payload.email,
            picture: payload.picture,
        });
    } catch (e) {
        console.error('Google credential parse error:', e);
    }
}

function handleFallbackLogin() {
    // GIS未ロード時のモックログイン（開発用）
    onGoogleLoginSuccess({ name: 'MatsuriUser', email: '', picture: '' });
}

function onGoogleLoginSuccess(user) {
    isLoggedIn = true;
    currentUser = user;
    closeLoginPrompt();

    // プロフィール欄を実際のGoogleアカウント情報で更新
    const nameEl = document.getElementById('profileName');
    const emailEl = document.getElementById('profileEmail');
    const avatarEl = document.getElementById('profileAvatar');
    if (nameEl) nameEl.textContent = user.name || 'MatsuriUser';
    if (emailEl) emailEl.textContent = user.email || '';
    if (avatarEl && user.picture) {
        avatarEl.innerHTML =
            `<img src="${user.picture}" class="w-full h-full object-cover" alt="avatar">`;
    }

    document.getElementById('loggedOutView').classList.add('hidden');
    document.getElementById('loggedInView').classList.remove('hidden');
    document.getElementById('loggedInView').classList.add('flex');

    // ログイン後: いいねとして登録しようとしていたイベントを自動追加
    if (currentSelectedEvent && !likedIds.includes(currentSelectedEvent.id)) {
        likedIds.push(currentSelectedEvent.id);
        updateSheetButtons();
    }
    renderMyPageList();
}

function triggerLogin() {
    openLoginPrompt();
    // GISが読み込まれていればOne Tapを試みる
    setTimeout(() => {
        if (typeof google !== 'undefined' && google.accounts) {
            google.accounts.id.prompt((notification) => {
                if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                    // One Tapが出ない場合はモーダルのボタンを使う
                }
            });
        }
    }, 300);
}

// ════════════════════════════════════════════════════════════════
//  クラウドデータ取得（失敗時はローカルデータにフォールバック）
// ════════════════════════════════════════════════════════════════
async function loadCloudData() {
    // プレースホルダーURLのままなら即スキップ（ローカルデータを使用）
    if (API_URL.includes("YOUR-CLOUD-SERVER")) {
        console.info("[MatsuriNavi] API_URL未設定 → ローカルデータで起動");
        return;
    }
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000); // 8秒タイムアウト
        const res = await fetch(API_URL, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
            window.allEvents = data;
            console.info(`[MatsuriNavi] クラウドから ${data.length} 件取得`);
        } else {
            throw new Error("空データ");
        }
    } catch (e) {
        // 圏外・タイムアウト・URLエラーなどすべてここで吸収
        console.warn("[MatsuriNavi] クラウド取得失敗 → ローカルデータで起動:", e.message);
    }
}

// ════════════════════════════════════════════════════════════════
//  初期化
// ════════════════════════════════════════════════════════════════
window.addEventListener('load', async function () {
    // ① クラウドからの最新データ取得を試みる（失敗時はローカルデータで継続）
    await loadCloudData();

    // ② ローカルデータも含めて検証
    if (!window.allEvents || window.allEvents.length === 0) {
        console.error('allEvents が読み込まれていません');
        return;
    }

    // Leafletマップ初期化
    map = L.map('map', { zoomControl: false }).setView([36.5, 137.5], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // マーカークラスタリング
    markerLayer = L.markerClusterGroup({
        maxClusterRadius: 70,
        showCoverageOnHover: false,
        spiderfyOnMaxZoom: true,
        zoomToBoundsOnClick: true,
        chunkedLoading: true,
    });
    map.addLayer(markerLayer);

    renderMapMarkers();
    renderSearchList();

    // Google Sign-In 初期化（GISロード完了を待つ）
    if (typeof google !== 'undefined' && google.accounts) {
        initGoogleSignIn();
    } else {
        // GIS は async で遅れる可能性があるので待機
        const gisTimer = setInterval(() => {
            if (typeof google !== 'undefined' && google.accounts) {
                clearInterval(gisTimer);
                initGoogleSignIn();
            }
        }, 500);
        // 5秒でタイムアウトしてフォールバック表示
        setTimeout(() => {
            clearInterval(gisTimer);
            document.getElementById('fallbackGoogleBtn')?.classList.remove('hidden');
        }, 5000);
    }
});

// ════════════════════════════════════════════════════════════════
//  地域フィルター
// ════════════════════════════════════════════════════════════════
function changeRegionFilter(region) {
    currentRegionName = region;
    if (region === "全国") {
        map.setView([36.5, 137.5], 5);
    } else {
        const c = regionCenters[region];
        if (c) map.setView([c[0], c[1]], c[2]);
    }
    renderMapMarkers();
    renderSearchList();
}

// ════════════════════════════════════════════════════════════════
//  マップマーカー描画
// ════════════════════════════════════════════════════════════════
function renderMapMarkers() {
    markerLayer.clearLayers();
    const emojis = { '祭り': '🏮', '花火': '🎆', '屋台': '🍡', '文化': '🎭' };
    const events = window.allEvents || [];
    events.filter(e => {
        const okRegion = currentRegionName === "全国" || e.region === currentRegionName;
        const okCat = activeCategory === "全体" || e.category === activeCategory;
        return okRegion && okCat;
    }).forEach(ev => {
        const icon = L.divIcon({
            html: emojis[ev.category] || '📍',
            className: 'custom-marker',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
        });
        const marker = L.marker([ev.lat, ev.lng], { icon });
        marker.on('click', () => openBottomSheet(ev));
        markerLayer.addLayer(marker);
    });
}

// ════════════════════════════════════════════════════════════════
//  タイムライン描画
// ════════════════════════════════════════════════════════════════
function renderSearchList() {
    const container = document.getElementById('searchList');
    container.innerHTML = '';
    const events = window.allEvents || [];
    const filtered = events.filter(e =>
        currentRegionName === "全国" || e.region === currentRegionName
    );
    filtered.slice(0, 200).forEach(ev => {
        const catEmoji = { '祭り': '🏮', '花火': '🎆', '屋台': '🍡', '文化': '🎭' }[ev.category] || '📍';
        const card = document.createElement('div');
        card.className = 'event-card';
        card.innerHTML = `
            <div class="relative cursor-pointer" onclick="openBottomSheetById('${ev.id}')">
                <img src="${ev.imageUrl}" class="w-full h-44 object-cover" loading="lazy" alt="${ev.name}">
                <div class="absolute inset-0 bg-gradient-to-t from-black/65 via-transparent to-transparent"></div>
                <span class="absolute top-3 left-3 text-[10px] font-extrabold text-white bg-black/50 backdrop-blur-sm px-2.5 py-1 rounded-full border border-white/20">
                    ${catEmoji} ${ev.category}
                </span>
                <span class="absolute top-3 right-3 text-[10px] font-extrabold text-white bg-gradient-to-r from-[#FF7000] to-[#FF3040] px-2.5 py-1 rounded-full">
                    🔥 ${ev.heatScore}
                </span>
            </div>
            <div class="p-4">
                <h4 class="text-sm font-extrabold text-white tracking-wide mb-2">${ev.name}</h4>
                <div class="date-badge mb-3">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>${ev.date || '開催日未定'}</span>
                </div>
                <p class="text-xs text-gray-400 leading-relaxed mb-3">${ev.description}</p>
                <div class="flex items-center justify-between pt-2 border-t border-white/5">
                    <span class="text-[10px] text-gray-500 font-bold">
                        <i class="fa-solid fa-location-dot mr-1"></i>${ev.region || ''}
                    </span>
                    <div class="flex items-center gap-4 text-lg text-gray-500">
                        <i class="fa-regular fa-heart cursor-pointer hover:text-pink-400 transition-colors"
                           onclick="event.stopPropagation(); openBottomSheetById('${ev.id}')"></i>
                        <i class="fa-regular fa-calendar-plus cursor-pointer hover:text-white transition-colors"
                           onclick="event.stopPropagation(); openBottomSheetById('${ev.id}')"></i>
                    </div>
                </div>
            </div>`;
        container.appendChild(card);
    });
}

// ════════════════════════════════════════════════════════════════
//  カテゴリフィルター
// ════════════════════════════════════════════════════════════════
function filterCategory(cat) {
    activeCategory = cat;
    document.querySelectorAll('.cat-chip').forEach(btn => {
        const active = btn.innerText.trim().includes(cat) ||
                       (cat === "全体" && btn.innerText.trim() === "全体");
        btn.className = active
            ? "cat-chip bg-white text-black px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap shadow-lg"
            : "cat-chip bg-black/60 text-gray-300 px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap backdrop-blur-sm border border-white/10";
    });
    renderMapMarkers();
}

// ════════════════════════════════════════════════════════════════
//  ボトムシート
// ════════════════════════════════════════════════════════════════
function openBottomSheet(ev) {
    currentSelectedEvent = ev;
    document.getElementById('sheetImage').src = ev.imageUrl || '';
    document.getElementById('sheetName').textContent = ev.name;
    document.getElementById('sheetDate').innerHTML =
        `<i class="fa-solid fa-calendar-days"></i> ${ev.date || '開催日未定'}`;
    document.getElementById('sheetScore').textContent = '🔥 ' + ev.heatScore;
    document.getElementById('sheetDesc').textContent = ev.description || '';
    document.getElementById('sheetWebBtn').href = ev.eventUrl || '#';
    updateSheetButtons();
    document.getElementById('detailBottomSheet').classList.remove('translate-y-full');
}

function openBottomSheetById(id) {
    const ev = (window.allEvents || []).find(e => e.id === id);
    if (ev) openBottomSheet(ev);
}

function closeBottomSheet() {
    document.getElementById('detailBottomSheet').classList.add('translate-y-full');
}

function launchNav() {
    if (!currentSelectedEvent) return;
    window.open(
        `https://www.google.com/maps/search/?api=1&query=${currentSelectedEvent.lat},${currentSelectedEvent.lng}`,
        '_blank'
    );
}

function updateSheetButtons() {
    if (!currentSelectedEvent) return;
    const liked = likedIds.includes(currentSelectedEvent.id);
    const cal   = calendarIds.includes(currentSelectedEvent.id);

    const likeBtn = document.getElementById('sheetLikeBtn');
    likeBtn.className = liked
        ? "border border-pink-500 text-pink-500 py-3 rounded-2xl font-bold text-xs flex items-center justify-center gap-1.5 bg-pink-500/5"
        : "border border-gray-800 text-white py-3 rounded-2xl font-bold text-xs flex items-center justify-center gap-1.5";
    likeBtn.innerHTML = liked
        ? `<i class="fa-solid fa-heart"></i> いいね済`
        : `<i class="fa-regular fa-heart"></i> いいね`;

    const calBtn = document.getElementById('sheetCalBtn');
    calBtn.className = cal
        ? "bg-gradient-to-r from-green-600 to-emerald-500 text-white py-3 rounded-2xl font-bold text-xs flex items-center justify-center gap-1.5"
        : "bg-white text-black py-3 rounded-2xl font-bold text-xs flex items-center justify-center gap-1.5";
    calBtn.innerHTML = cal
        ? `<i class="fa-solid fa-calendar-check"></i> 予定追加済`
        : `<i class="fa-solid fa-calendar-plus"></i> カレンダー登録`;
}

// ════════════════════════════════════════════════════════════════
//  いいね / カレンダー登録 ── ハプティクス + ローカル通知
// ════════════════════════════════════════════════════════════════
async function toggleLikeClick() {
    if (!isLoggedIn) { triggerLogin(); return; }
    const id = currentSelectedEvent.id;
    const wasLiked = likedIds.includes(id);
    likedIds = wasLiked
        ? likedIds.filter(i => i !== id)
        : [...likedIds, id];

    // ハプティクス: いいね時は Medium、解除時は Light
    await hapticImpact(wasLiked ? 'Light' : 'Medium');

    updateSheetButtons();
    renderMyPageList();
}

async function toggleCalClick() {
    if (!isLoggedIn) { triggerLogin(); return; }
    const id = currentSelectedEvent.id;
    const wasCal = calendarIds.includes(id);
    calendarIds = wasCal
        ? calendarIds.filter(i => i !== id)
        : [...calendarIds, id];

    if (!wasCal) {
        // カレンダー登録時: Heavy ハプティクス + 通知
        await hapticNotification('Success');
        await scheduleLocalNotification(
            '📅 カレンダーに登録しました',
            `「${currentSelectedEvent.name}」を予定に追加しました。当日お見逃しなく！`
        );
    } else {
        await hapticImpact('Light');
    }

    updateSheetButtons();
    renderMyPageList();
}

// ════════════════════════════════════════════════════════════════
//  ログインモーダル
// ════════════════════════════════════════════════════════════════
function openLoginPrompt() {
    const modal = document.getElementById('loginPromptModal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    // GISボタンをレンダリング（まだなら）
    if (typeof google !== 'undefined' && google.accounts) {
        google.accounts.id.renderButton(
            document.getElementById('googleSignInBtn'),
            { theme: 'outline', size: 'large', width: 300, text: 'signin_with', shape: 'pill' }
        );
    }
}
function closeLoginPrompt() {
    const modal = document.getElementById('loginPromptModal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
}

// ════════════════════════════════════════════════════════════════
//  マイページ
// ════════════════════════════════════════════════════════════════
function renderMyPageList() {
    const container = document.getElementById('myPageList');
    container.innerHTML = '';
    const ids = currentMyPageSubTab === "calendar" ? calendarIds : likedIds;
    const items = (window.allEvents || []).filter(e => ids.includes(e.id));
    if (items.length === 0) {
        container.innerHTML =
            `<p class="text-center text-gray-600 text-xs py-12">まだ登録がありません。</p>`;
        return;
    }
    items.forEach(ev => {
        const row = document.createElement('div');
        row.className = "flex items-center gap-3 bg-[#1F2937]/40 border border-gray-900 p-2.5 rounded-2xl cursor-pointer";
        row.onclick = () => openBottomSheet(ev);
        row.innerHTML = `
            <img src="${ev.imageUrl}" class="w-12 h-12 object-cover rounded-xl" loading="lazy">
            <div class="flex-1 min-w-0">
                <h5 class="text-sm font-bold text-white truncate">${ev.name}</h5>
                <p class="text-[10px] text-[#38BDF8] font-bold mt-0.5">
                    <i class="fa-solid fa-calendar-days"></i> ${ev.date || '開催日未定'}
                </p>
            </div>
            <i class="fa-solid fa-chevron-right text-gray-700 text-xs"></i>`;
        container.appendChild(row);
    });
}

function switchMyPageSubTab(type) {
    currentMyPageSubTab = type;
    document.getElementById('subTabCal').className =
        "flex-1 py-2.5 text-center font-bold text-xs " +
        (type === "calendar" ? "text-[#FF3040] border-b-2 border-[#FF3040]" : "text-gray-500");
    document.getElementById('subTabLike').className =
        "flex-1 py-2.5 text-center font-bold text-xs " +
        (type === "liked" ? "text-[#FF3040] border-b-2 border-[#FF3040]" : "text-gray-500");
    renderMyPageList();
}

// ════════════════════════════════════════════════════════════════
//  タブ切り替え
// ════════════════════════════════════════════════════════════════
function switchTab(tabName) {
    closeBottomSheet();
    document.querySelectorAll('.tab-pane').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + tabName).classList.add('active');

    ['map', 'search', 'mypage'].forEach(name => {
        const btn = document.getElementById('nav' + name.charAt(0).toUpperCase() + name.slice(1));
        if (!btn) return;
        btn.classList.toggle('text-[#FF3040]', name === tabName);
        btn.classList.toggle('text-gray-500',  name !== tabName);
    });

    if (tabName === 'map' && map) {
        setTimeout(() => map.invalidateSize(), 200);
    }
}
</script>
