<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MatsuriNavi</title>
    <meta name="google-signin-client_id" content="982642152853-sj2t98l3obh57gu7ftpadivtc3kdck46.apps.googleusercontent.com">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script src="events-data.js?v=3"></script>
    <script src="events-extra.js?v=3"></script>
    <script src="events-yatai.js?v=3"></script>
    <script src="kagawa_parking.js?v=3"></script>
    <script src="matsuri_data.js?v=3"></script>
    <script src="kagawa_minor200.js?v=3"></script>
    <script src="kagawa_extra100.js?v=3"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');

        :root {
            --gold:       #C9A84C;
            --gold-light: #E8C882;
            --sakura:     #D4849A;
            --navy:       #0B0F19;
            --navy-mid:   #141826;
            --glass:      rgba(18,22,38,0.82);
            --border:     rgba(255,255,255,0.07);
            --border-g:   rgba(201,168,76,0.28);
        }

        * { box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            margin: 0; padding: 0;
            overscroll-behavior: none;
        }

        .app-container {
            max-width: 430px;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            margin: 0 auto;
            background: var(--navy);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(0,0,0,0.98);
        }

        /* ── タブ（AdMob 領域分のオフセット込み） ── */
        .tab-pane { position: absolute; inset: 0; z-index: 1; display: none; }
        .tab-pane.active { display: block; }
        .tab-scroll {
            position: absolute; inset: 0;
            overflow-y: auto;
            padding-top: calc(64px + var(--ad-top));
            padding-bottom: 120px;
        }

        /* ── AdMob 用 上部スペーサー（whoo風） ──
           AdMob ネイティブ広告が画面上部 TOP_CENTER に重なるため、
           UI 全体を 65px 下にオフセットしてタップ可能領域を確保する。
           Web プレビュー時は透明スペーサーとして機能する。 */
        :root { --ad-top: calc(65px + env(safe-area-inset-top, 0px)); }
        .ad-spacer {
            position: absolute; top: 0; left: 0; right: 0;
            height: var(--ad-top);
            z-index: 1400;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(11,15,25,0.55) 0%, rgba(11,15,25,0.15) 70%, transparent 100%);
            -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
        }

        /* ── ヘッダー（広告分の余白を含む） ── */
        .floating-header {
            position: absolute; top: var(--ad-top); left: 0; right: 0; z-index: 1500;
            background: rgba(11,15,25,0.92);
            -webkit-backdrop-filter: blur(28px); backdrop-filter: blur(28px);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .app-logo {
            font-size: 19px; font-weight: 800; letter-spacing: -0.5px;
            background: linear-gradient(90deg, #E8C882 0%, #C9A84C 60%, #E8C882 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        /* ── ナビバー ── */
        .floating-nav {
            position: absolute;
            left: 20px; right: 20px;
            bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
            z-index: 4000;
            background: rgba(10,14,26,0.9);
            -webkit-backdrop-filter: blur(32px); backdrop-filter: blur(32px);
            border-radius: 9999px;
            border: 1px solid rgba(255,255,255,0.09);
            box-shadow: 0 8px 48px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.05);
            display: flex; justify-content: space-around; align-items: center;
            padding: 8px 20px;
        }
        .nav-btn { transition: color 0.2s; }

        /* ── マーカークラスタ ── */
        .marker-cluster-small,
        .marker-cluster-medium,
        .marker-cluster-large {
            background-color: rgba(201,168,76,0.12) !important;
        }
        .marker-cluster-small div,
        .marker-cluster-medium div,
        .marker-cluster-large div {
            background-color: rgba(201,168,76,0.82) !important;
            color: #000 !important; font-weight: 800; font-size: 12px;
        }
        .custom-marker { display: flex; align-items: center; justify-content: center; }
        .marker-pin {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(11,15,25,0.92);
            border: 1.5px solid rgba(201,168,76,0.7);
            box-shadow: 0 4px 18px rgba(0,0,0,0.55), 0 0 14px rgba(201,168,76,0.2);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        }

        /* ── カテゴリチップ ── */
        .cat-chip {
            cursor: pointer; transition: all 0.18s;
            display: flex; align-items: center; gap: 5px;
            white-space: nowrap;
        }
        .cat-chip.is-active {
            background: linear-gradient(135deg, rgba(201,168,76,0.2), rgba(232,200,130,0.1));
            border-color: rgba(201,168,76,0.55) !important;
            color: #E8C882;
        }
        .cat-chip.is-inactive {
            background: rgba(255,255,255,0.035);
            border-color: rgba(255,255,255,0.08) !important;
            color: rgba(255,255,255,0.38);
        }

        /* ── 日付バッジ ── */
        .date-badge {
            display: inline-flex; align-items: center; gap: 5px;
            background: rgba(201,168,76,0.09);
            border: 1px solid rgba(201,168,76,0.28);
            border-radius: 9999px; padding: 4px 12px;
            font-size: 11px; font-weight: 700; color: var(--gold-light);
        }

        /* ── イベントカード ── */
        .event-card {
            margin: 0 14px 14px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 22px; overflow: hidden;
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
            box-shadow: 0 4px 28px rgba(0,0,0,0.32);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .event-card:active { transform: scale(0.984); box-shadow: 0 2px 12px rgba(0,0,0,0.2); }

        /* ── 検索バー ── */
        .search-input {
            width: 100%;
            background: rgba(255,255,255,0.048);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 13px 18px 13px 46px;
            color: #fff; font-size: 14px; font-family: inherit;
            outline: none;
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: rgba(201,168,76,0.5); }
        .search-input::placeholder { color: rgba(255,255,255,0.28); }

        /* ── 日付スライダー ── */
        input[type="range"].ms-slider {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 3px; border-radius: 2px;
            background: linear-gradient(
                to right,
                var(--gold) 0%,
                var(--gold) var(--pct, 100%),
                rgba(255,255,255,0.1) var(--pct, 100%),
                rgba(255,255,255,0.1) 100%
            );
            outline: none; cursor: pointer;
        }
        input[type="range"].ms-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px; height: 20px; border-radius: 50%;
            background: linear-gradient(135deg, #E8C882, #C9A84C);
            border: 2px solid rgba(255,255,255,0.25);
            box-shadow: 0 2px 14px rgba(201,168,76,0.55);
            cursor: pointer; transition: transform 0.1s;
        }
        input[type="range"].ms-slider::-webkit-slider-thumb:active { transform: scale(1.2); }

        /* ── ボトムシート ── */
        .sheet-glass {
            background: rgba(12,16,28,0.98);
            -webkit-backdrop-filter: blur(40px); backdrop-filter: blur(40px);
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        /* ── 金ライン区切り ── */
        .gold-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(201,168,76,0.35), transparent);
        }

        ::-webkit-scrollbar { display: none; }

        /* ── 地方ドロップダウン ── */
        .region-dropdown { position: relative; }
        .region-btn {
            display: flex; align-items: center; gap: 5px;
            background: rgba(255,255,255,0.055);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 9999px;
            padding: 6px 14px;
            color: rgba(255,255,255,0.78);
            font-size: 12px; font-weight: 700; font-family: inherit;
            cursor: pointer; outline: none;
            transition: background 0.15s, border-color 0.15s;
            white-space: nowrap;
        }
        .region-btn:active, .region-btn.open {
            background: rgba(201,168,76,0.12);
            border-color: rgba(201,168,76,0.4);
            color: #E8C882;
        }
        .region-btn svg { transition: transform 0.2s; }
        .region-btn.open svg { transform: rotate(180deg); }
        .region-menu {
            display: none;
            position: absolute; top: calc(100% + 8px); right: 0;
            min-width: 160px;
            background: rgba(12,16,30,0.97);
            -webkit-backdrop-filter: blur(40px); backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 16px 60px rgba(0,0,0,0.9), 0 0 0 0.5px rgba(255,255,255,0.04) inset;
            z-index: 9999;
        }
        .region-menu.open { display: block; }
        .region-item {
            display: flex; align-items: center; gap: 9px;
            padding: 13px 18px;
            font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.65);
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.13s, color 0.13s;
        }
        .region-item:last-child { border-bottom: none; }
        .region-item:active { background: rgba(201,168,76,0.1); color: #E8C882; }
        .region-item.selected {
            color: #E8C882;
            background: linear-gradient(90deg, rgba(201,168,76,0.13), rgba(201,168,76,0.04));
        }
        .region-item .ri-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: rgba(201,168,76,0.0); flex-shrink: 0;
            transition: background 0.15s;
        }
        .region-item.selected .ri-dot { background: var(--gold); }

        /* ── 駐車場ピン（マップ上） ── */
        .parking-pin {
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(11,15,25,0.92);
            box-shadow: 0 3px 14px rgba(0,0,0,0.55);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
            font-weight: 800; font-size: 13px; color: #fff;
            animation: parkFadeIn 0.4s ease-out;
        }
        .parking-pin.permanent { border: 1.8px solid #5BA8FF; color:#5BA8FF; }
        .parking-pin.temporary { border: 1.8px solid #FFA73A; color:#FFA73A; }
        @keyframes parkFadeIn {
            from { opacity:0; transform: translateY(8px) scale(0.85); }
            to   { opacity:1; transform: translateY(0) scale(1); }
        }

        /* ── 駐車場リストアイテム（ボトムシート内） ── */
        .parking-item {
            display: flex; align-items: center; gap: 11px;
            padding: 11px 13px;
            background: rgba(255,255,255,0.035);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
            cursor: pointer;
        }
        .parking-item:active { transform: scale(0.985); background: rgba(201,168,76,0.08); border-color: rgba(201,168,76,0.28); }
        .parking-item .pi-icon {
            width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 13px;
        }
        .parking-item.permanent .pi-icon { background: rgba(91,168,255,0.13); color: #7FB8FF; border:1px solid rgba(91,168,255,0.32); }
        .parking-item.temporary .pi-icon { background: rgba(255,167,58,0.13); color: #FFB766; border:1px solid rgba(255,167,58,0.32); }
        .parking-item .pi-body { flex:1; min-width:0; }
        .parking-item .pi-name { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.86); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .parking-item .pi-meta { display:flex; gap:8px; margin-top:3px; }
        .parking-item .pi-badge {
            display:inline-flex; align-items:center; gap:3px;
            padding:2px 7px; border-radius:9999px;
            font-size: 9px; font-weight: 700;
        }
        .parking-item.permanent .pi-badge.type { background: rgba(91,168,255,0.13); color:#7FB8FF; }
        .parking-item.temporary .pi-badge.type { background: rgba(255,167,58,0.13); color:#FFB766; }
        .parking-item .pi-badge.fee { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.55); }
        .parking-item .pi-nav {
            font-size: 11px; padding: 6px 10px; border-radius: 9999px;
            background: rgba(16,185,129,0.13); color: #34d399; border:1px solid rgba(16,185,129,0.28);
            font-weight: 800; white-space:nowrap;
        }
        .parking-legend-dot {
            display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:3px; vertical-align:middle;
        }

        /* ── いいねハートアイコン（祭り名横） ── */
        .like-heart {
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.4);
            cursor: pointer; outline: none;
            transition: all 0.18s ease;
            font-size: 16px;
        }
        .like-heart:active { transform: scale(0.88); }
        .like-heart.liked {
            background: linear-gradient(135deg, rgba(255,80,108,0.18), rgba(255,120,140,0.08));
            border-color: rgba(255,90,120,0.5);
            color: #FF5A78;
            box-shadow: 0 0 16px rgba(255,90,120,0.35);
        }
        .like-heart.liked i { animation: heartPop 0.4s ease-out; }
        @keyframes heartPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.4); }
            70% { transform: scale(0.92); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
<div class="app-container">

    <!-- ── AdMob 上部スペーサー（whoo 風）──
         AdMob ネイティブ広告が画面最上部にオーバーレイされる領域。
         透明グラデーションでマップが透けて見えるミニマルスタイル。 -->
    <div class="ad-spacer" id="adSpacer"></div>

    <!-- ── フローティングヘッダー ── -->
    <div class="floating-header">
        <span class="app-logo">MatsuriNavi</span>
        <div class="flex items-center gap-2.5">
            <!-- カスタム地方ドロップダウン -->
            <div class="region-dropdown" id="regionDropdown">
                <button class="region-btn" id="regionBtn" onclick="toggleRegionMenu(event)">
                    <span id="regionLabel">全国</span>
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="region-menu" id="regionMenu">
                    <div class="region-item selected" onclick="selectRegion('全国',this)"><span class="ri-dot"></span>全国</div>
                    <div class="region-item" onclick="selectRegion('北海道・東北',this)"><span class="ri-dot"></span>北海道・東北</div>
                    <div class="region-item" onclick="selectRegion('関東',this)"><span class="ri-dot"></span>関東</div>
                    <div class="region-item" onclick="selectRegion('中部',this)"><span class="ri-dot"></span>中部</div>
                    <div class="region-item" onclick="selectRegion('近畿',this)"><span class="ri-dot"></span>近畿</div>
                    <div class="region-item" onclick="selectRegion('中国・四国',this)"><span class="ri-dot"></span>中国・四国</div>
                    <div class="region-item" onclick="selectRegion('九州・沖縄',this)"><span class="ri-dot"></span>九州・沖縄</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ══════════ マップタブ ══════════ -->
    <div id="tab-map" class="tab-pane active">
        <!-- カテゴリチップ + 日付スライダー（マップ上に浮かせる） -->
        <div class="absolute left-0 right-0 z-[1200]" style="top:calc(64px + var(--ad-top));">
            <!-- チップ列 -->
            <div class="flex gap-2 px-4 pt-2 pb-1.5 overflow-x-auto"
                 style="background:rgba(11,15,25,0.7); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);">
                <button onclick="filterCategory('全体')" id="chip-全体"
                    class="cat-chip is-active border px-4 py-1.5 rounded-full text-xs font-bold">
                    <i class="fa-regular fa-circle-dot"></i> 全体
                </button>
                <button onclick="filterCategory('祭り')" id="chip-祭り"
                    class="cat-chip is-inactive border px-4 py-1.5 rounded-full text-xs font-bold">
                    <i class="fa-solid fa-torii-gate"></i> 祭り
                </button>
                <button onclick="filterCategory('花火')" id="chip-花火"
                    class="cat-chip is-inactive border px-4 py-1.5 rounded-full text-xs font-bold">
                    <i class="fa-solid fa-sparkles"></i> 花火
                </button>
                <button onclick="filterCategory('屋台')" id="chip-屋台"
                    class="cat-chip is-inactive border px-4 py-1.5 rounded-full text-xs font-bold">
                    <i class="fa-solid fa-store"></i> 屋台
                </button>
            </div>
            <!-- 日付スライダー -->
            <div class="px-5 pt-2 pb-3"
                 style="background:rgba(11,15,25,0.82); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[10px] font-bold" style="color:var(--gold)">
                        <i class="fa-regular fa-calendar-days mr-1"></i>表示期間
                    </span>
                    <span id="mapSliderText" class="text-[11px] font-bold text-white">全期間</span>
                </div>
                <input type="range" class="ms-slider" id="mapSlider" min="0" max="365" value="365"
                    oninput="onMapSlider(this.value)">
                <div class="flex justify-between mt-1.5">
                    <span class="text-[9px] font-bold" style="color:rgba(255,255,255,0.25)">今日</span>
                    <span class="text-[9px] font-bold" style="color:rgba(255,255,255,0.25)">1年後</span>
                </div>
            </div>
        </div>
        <!-- マップ本体 -->
        <div id="map" style="position:absolute; inset:0; width:100%; height:100%;"></div>
        <!-- マップ表示件数バッジ -->
        <div id="mapCountBadge"
             style="position:absolute; right:18px; bottom:110px; z-index:1300;
                    background:rgba(11,15,25,0.92); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
                    border:1px solid rgba(201,168,76,0.35); color:#E8C882;
                    padding:7px 13px; border-radius:9999px;
                    font-size:12px; font-weight:800; letter-spacing:0.3px;
                    box-shadow:0 4px 18px rgba(0,0,0,0.55);">
            <i class="fa-regular fa-map mr-1"></i>0件
        </div>
    </div>

    <!-- ══════════ リサーチタブ ══════════ -->
    <div id="tab-search" class="tab-pane" style="background:var(--navy);">
        <!-- 固定フィルターエリア -->
        <div class="absolute left-0 right-0 z-[1200]" id="researchFilters"
             style="top:calc(64px + var(--ad-top)); background:rgba(11,15,25,0.97); -webkit-backdrop-filter:blur(24px); backdrop-filter:blur(24px);">
            <!-- 検索バー -->
            <div class="px-4 pt-3 pb-2 relative">
                <i class="fa-regular fa-magnifying-glass absolute text-sm"
                   style="left:32px; top:50%; transform:translateY(-30%); color:rgba(201,168,76,0.65)"></i>
                <input type="text" id="researchInput" class="search-input"
                    placeholder="祭り名・地域・キーワードで検索…"
                    oninput="onResearchInput()">
            </div>
            <!-- カテゴリチップ -->
            <div class="flex gap-2 px-4 pb-2 overflow-x-auto">
                <button onclick="filterResCat('全体')" id="rcat-全体"
                    class="cat-chip is-active border px-3.5 py-1.5 rounded-full text-xs font-bold">
                    <i class="fa-regular fa-circle-dot"></i> 全体
                </button>
                <button onclick="filterResCat('祭り')" id="rcat-祭り"

<script>

const REGION_CENTERS = {

// ── Unsplash フォールバック画像 ──────────────────────────
const FALLBACK = {

        'https://images.unsplash.com/photo-1533050487297-09b450131914?w=800&q=80',

];

// AI画像URL検知（DALLE/Midjourney/SD/image_generation 等）
function isAIImage(url) {
    if (!url) return true;
    const s = String(url).toLowerCase();
    return s.includes('image_generation') || s.includes('image-generation')
        || s.includes('ai-generated') || s.includes('aigen')
        || s.includes('dalle') || s.includes('midjourney')
        || s.includes('stable-diffusion') || s.includes('stable_diffusion');
}

// 和モダンプレースホルダー（カテゴリ別 SVG + ガラス質感グラデーション）
const PLACEHOLDER_THEME = {
    '祭り': { g1: '#1B1530', g2: '#3A2540', accent: '#D4849A',
              svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#E8C882" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18l-1.5-3H4.5L3 9zM4 9v11h16V9M9 13v4M15 13v4M9 9V6M15 9V6"/></svg>' },
    '花火': { g1: '#0C1230', g2: '#1F1A4A', accent: '#E8C882',
              svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#E8C882" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="1.8" fill="#E8C882"/><path d="M12 4v2.5M12 17.5V20M4 12h2.5M17.5 12H20M6.3 6.3l1.8 1.8M16 16l1.8 1.8M17.7 6.3l-1.8 1.8M8 16l-1.8 1.8"/></svg>' },
    '屋台': { g1: '#2A1A1F', g2: '#3D2A30', accent: '#F4C6CE',
              svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#F4C6CE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18l-1 3H4L3 8z"/><path d="M5 11v9h14v-9M9 14v6M15 14v6"/></svg>' },
    '文化': { g1: '#1A1A2E', g2: '#2A2A45', accent: '#C9A84C',
              svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20M4 20V9l8-5 8 5v11M9 20v-7h6v7"/></svg>' }
};

function placeholderDataUrl(ev) {
    const t = PLACEHOLDER_THEME[ev.category] || PLACEHOLDER_THEME['祭り'];
    // 桜文様・和柄サークルパターンを背景にしたガラス質感カード
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="${t.g1}"/>
          <stop offset="100%" stop-color="${t.g2}"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.85" cy="0.15" r="0.9">
          <stop offset="0%" stop-color="${t.accent}" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="${t.accent}" stop-opacity="0"/>
        </radialGradient>
        <pattern id="dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
          <circle cx="18" cy="18" r="0.6" fill="${t.accent}" fill-opacity="0.18"/>
        </pattern>
      </defs>
      <rect width="400" height="240" fill="url(#g)"/>
      <rect width="400" height="240" fill="url(#dots)"/>
      <rect width="400" height="240" fill="url(#glow)"/>
      <g transform="translate(160,70) scale(3.5)">${t.svg.replace(/<svg[^>]*>|<\/svg>/g,'')}</g>
      <line x1="0" y1="239.5" x2="400" y2="239.5" stroke="${t.accent}" stroke-opacity="0.35" stroke-width="1"/>
    </svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

function getImg(ev) {
    const url = ev.imageUrl || '';
    const bad = !url || url.length < 12
        || isAIImage(url)
        || url.includes('placeholder')
        || url.includes('picsum')
        || url.includes('lorempixel')
        || url.includes('dummyimage')
        || url.includes('via.placeholder');
    if (!bad) return url;
    // 実写フォールバック画像があれば使う、なければ和モダンプレースホルダー
    const pool = FALLBACK[ev.category] || FALLBACK_ANY;
    if (pool && pool.length) {
        const seed = (ev.id || '').split('').reduce((a, c) => a + c.charCodeAt(0), 0);
        return pool[seed % pool.length];
    }
    return placeholderDataUrl(ev);
}

// ── 日付ユーティリティ ────────────────────────────────────
function daysDiff(dateStr) {
    if (!dateStr) return Infinity;
    let m = dateStr.match(/(\d{4})[年\-\/](\d{1,2})[月\-\/](\d{1,2})/);
    if (m) {
        const d = new Date(+m[1], +m[2]-1, +m[3]);
        return Math.floor((d - Date.now()) / 86400000);
    }
    m = dateStr.match(/(\d{1,2})[\/月](\d{1,2})/);
    if (m) {
        const now = new Date();
        const d = new Date(now.getFullYear(), +m[1]-1, +m[2]);
        if (d < now) d.setFullYear(d.getFullYear() + 1);
        return Math.floor((d - Date.now()) / 86400000);
    }
    return Infinity;
}

function daysToLabel(days) {
    if (days >= 365) return '全期間';
    const d = new Date(Date.now() + days * 86400000);
    return `〜${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

function updateSlider(el, val) {
    el.style.setProperty('--pct', (val / 365 * 100).toFixed(1) + '%');
}

async function loadCloudData() {
    if (API_URL.includes('YOUR-CLOUD-SERVER')) return;
    try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 8000);
        const res = await fetch(API_URL, { signal: ctrl.signal });
        clearTimeout(tid);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) window.allEvents = data;
        else throw new Error('空データ');
    } catch(e) {
        console.warn('[MatsuriNavi] クラウド取得失敗 → ローカル使用:', e.message);
    }
}

async function initPushNotifications() {
    const PN = getPlugin('PushNotifications');
    if (!PN) return;
    try {
        const perm = await PN.requestPermissions();
        if (perm.receive !== 'granted') return;
        await PN.register();
        await PN.addListener('registration', tok => {
            localStorage.setItem('fcmToken', tok.value);
            localStorage.setItem('fcmTokenAt', new Date().toISOString());
        });
        await PN.addListener('registrationError', e => console.error('[Push] error:', e));
        await PN.addListener('pushNotificationReceived', n => showPushBanner(n.title, n.body));
        await PN.addListener('pushNotificationActionPerformed', () => switchTab('map'));
    } catch(e) { console.warn('[Push] init error:', e.message); }
}

                <div class="pi-name">${p.name}</div>
                <div class="pi-meta">
                    <span class="pi-badge type">${typeLabel}</span>
                    ${fee}${cap}
                </div>
            </div>
            <div class="pi-nav">
                <i class="fa-solid fa-location-arrow"></i> ここへ
            </div>`;
        row.onclick = () => navigateToCoord(p.lat, p.lng, p.name);
        list.appendChild(row);
    });
}

function openBottomSheet(ev) {
    currentSelectedEvent = ev;
    const imgEl = document.getElementById('sheetImage');
    imgEl.src = getImg(ev);
    imgEl.onerror = () => { imgEl.src = placeholderDataUrl(ev); };
    document.getElementById('sheetName').textContent = ev.name;
    document.getElementById('sheetDate').innerHTML =
        `<i class="fa-regular fa-calendar-days"></i> ${ev.date || '開催日未定'}`;
    document.getElementById('sheetScore').textContent = `HOT ${ev.heatScore}`;
    document.getElementById('sheetDesc').textContent = ev.description || '';
    document.getElementById('sheetWebBtn').href = ev.eventUrl || '#';
    updateSheetButtons();
    renderParkingList(ev);
    renderParkingPins(ev);
    document.getElementById('detailBottomSheet').classList.remove('translate-y-full');
}

function openBottomSheetById(id) {
    const ev = (window.allEvents || []).find(e => e.id === id);
    if (ev) openBottomSheet(ev);
}

function closeBottomSheet() {
    document.getElementById('detailBottomSheet').classList.add('translate-y-full');
    clearParkingPins();
}

// ── ナビ起動：座標をスマホ純正マップへ正確に引き渡す ──
function navigateToCoord(lat, lng, label) {
    if (typeof lat !== 'number' || typeof lng !== 'number') return;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const q = encodeURIComponent(label || `${lat},${lng}`);
    if (isIOS) {
        // Apple Maps: ll= でピン位置を厳密指定、q= で名称表示
        window.location.href = `https://maps.apple.com/?ll=${lat},${lng}&q=${q}`;
    } else {
        // Google Maps: query=lat,lng で正確な座標を渡す
        window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`, '_blank');
    }
}

function launchNav() {
    if (!currentSelectedEvent) return;
    navigateToCoord(currentSelectedEvent.lat, currentSelectedEvent.lng, currentSelectedEvent.name);
}

function updateSheetButtons() {
    if (!currentSelectedEvent) return;
    const liked = likedIds.includes(currentSelectedEvent.id);
    const cal   = calendarIds.includes(currentSelectedEvent.id);

    // ハートアイコン（祭り名横）
    const heart = document.getElementById('sheetHeartBtn');
    const heartIcon = document.getElementById('sheetHeartIcon');
    if (heart && heartIcon) {
        heart.classList.toggle('liked', liked);
        heartIcon.className = liked ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
    }

    const cb = document.getElementById('sheetCalBtn');
    cb.style.cssText = cal
        ? 'background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.35);color:#34d399'
        : 'background:rgba(255,255,255,0.94);color:#000';
    cb.innerHTML = cal
        ? `<i class="fa-regular fa-calendar-check"></i> 予定追加済`
        : `<i class="fa-regular fa-calendar-plus"></i> カレンダー登録`;
}

// 駐車場検索：現在選択中の祭り会場周辺の駐車場を純正マップで検索
function searchParkingNearby() {
    if (!currentSelectedEvent) return;
    const lat = currentSelectedEvent.lat;
    const lng = currentSelectedEvent.lng;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    if (isIOS) {
        // Apple Maps: 中心座標を sll で指定し、q=駐車場 で検索
        window.location.href = `https://maps.apple.com/?q=${encodeURIComponent('駐車場')}&sll=${lat},${lng}&z=15`;
    } else {
        // Google Maps: クエリ「駐車場」を中心座標で検索
        window.open(`https://www.google.com/maps/search/${encodeURIComponent('駐車場')}/@${lat},${lng},15z`, '_blank');
    }
}

// ════════════════════════════════════════════════════════════
//  いいね / カレンダー登録
// ════════════════════════════════════════════════════════════
async function toggleLikeClick() {
    if (!isLoggedIn) { triggerLogin(); return; }
    const id = currentSelectedEvent.id;
    const was = likedIds.includes(id);
    likedIds = was ? likedIds.filter(i => i !== id) : [...likedIds, id];
    await hapticImpact(was ? 'Light' : 'Medium');
    updateSheetButtons(); renderMyPageList();
}

async function toggleCalClick() {
    if (!isLoggedIn) { triggerLogin(); return; }
    const id = currentSelectedEvent.id;
    const was = calendarIds.includes(id);
    calendarIds = was ? calendarIds.filter(i => i !== id) : [...calendarIds, id];
    if (!was) {
        await hapticNotification('Success');
        await scheduleLocalNotification('カレンダーに登録しました',
            `「${currentSelectedEvent.name}」を予定に追加しました。当日お見逃しなく！`);
    } else { await hapticImpact('Light'); }
    updateSheetButtons(); renderMyPageList();
}

// ════════════════════════════════════════════════════════════
//  ログインモーダル
// ════════════════════════════════════════════════════════════
function openLoginPrompt() {
    const m = document.getElementById('loginPromptModal');
    m.classList.remove('hidden'); m.classList.add('flex');
    if (typeof google !== 'undefined' && google.accounts) {
        google.accounts.id.renderButton(document.getElementById('googleSignInBtn'),
            { theme:'outline', size:'large', width:300, text:'signin_with', shape:'pill' });
    }
}
function closeLoginPrompt() {
    const m = document.getElementById('loginPromptModal');
    m.classList.add('hidden'); m.classList.remove('flex');
}

// ════════════════════════════════════════════════════════════
//  マイページ
// ════════════════════════════════════════════════════════════
function renderMyPageList() {
    const container = document.getElementById('myPageList');
    container.innerHTML = '';
    const ids = currentMyPageSubTab === 'calendar' ? calendarIds : likedIds;
    const items = (window.allEvents || []).filter(e => ids.includes(e.id));
    if (!items.length) {
        container.innerHTML = `
            <div class="flex flex-col items-center py-12 text-center">
                <i class="fa-regular fa-calendar-xmark text-3xl mb-3" style="color:rgba(201,168,76,0.25)"></i>
                <p class="text-xs" style="color:rgba(255,255,255,0.3)">まだ登録がありません</p>
            </div>`;
        return;
    }
    items.forEach(ev => {
        const row = document.createElement('div');
        row.className = 'flex items-center gap-3 p-2.5 rounded-2xl cursor-pointer';
        row.style.cssText = 'background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07)';
        row.onclick = () => openBottomSheet(ev);
        row.innerHTML = `
            <img src="${getImg(ev)}" class="w-12 h-12 object-cover rounded-xl" loading="lazy"
                 onerror="this.src='${FALLBACK_ANY[0]}'">
            <div class="flex-1 min-w-0">
                <h5 class="text-sm font-bold truncate">${ev.name}</h5>
                <p class="text-[10px] font-bold mt-0.5 flex items-center gap-1" style="color:var(--gold-light)">
                    <i class="fa-regular fa-calendar-days"></i>${ev.date || '開催日未定'}
                </p>
            </div>
            <i class="fa-regular fa-chevron-right text-xs" style="color:rgba(255,255,255,0.2)"></i>`;
        container.appendChild(row);
    });
}

function switchMyTab(type) {
    currentMyPageSubTab = type;
    const gold = `color:var(--gold);border-bottom:2px solid var(--gold)`;
    const gray = `color:rgba(255,255,255,0.38);border-bottom:2px solid transparent`;
    document.getElementById('subTabCal').style.cssText  = type === 'calendar' ? gold : gray;
    document.getElementById('subTabLike').style.cssText = type === 'liked'    ? gold : gray;
    renderMyPageList();
}

// ════════════════════════════════════════════════════════════
//  タブ切り替え
// ════════════════════════════════════════════════════════════
function switchTab(name) {
    closeBottomSheet();
    document.querySelectorAll('.tab-pane').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    ['map','search','mypage'].forEach(n => {
        const btn = document.getElementById('nav' + n.charAt(0).toUpperCase() + n.slice(1));
        if (btn) btn.style.color = n === name ? 'var(--gold)' : 'rgba(255,255,255,0.38)';
    });
    if (name === 'map' && map) setTimeout(() => map.invalidateSize(), 200);
    if (name === 'search') renderResearchList();
}
</script>

<!-- ════════════════════════════════════════════════════════════
     AdMob 初期化（whoo 風 TOP_CENTER バナー）
     - 実機テスト用に Google 公式テストID を固定使用
     - Capacitor 環境のみ実行（Web プレビュー時はスキップ）
     ════════════════════════════════════════════════════════════ -->
<script>
(async function initAdMobIfNative() {
    try {
        const Capacitor = window.Capacitor;
        if (!Capacitor || !Capacitor.isNativePlatform || !Capacitor.isNativePlatform()) {
            return; // Web プレビュー時はスキップ（透明スペーサーのみ表示）
        }
        const AdMob = (Capacitor.Plugins && Capacitor.Plugins.AdMob) || null;
        if (!AdMob) { console.warn('[AdMob] plugin not registered'); return; }

        await AdMob.initialize({
            initializeForTesting: true,
            testingDevices: [],
            tagForChildDirectedTreatment: false,
            tagForUnderAgeOfConsent: false,
            maxAdContentRating: 'PG'
        });
        // Google 公式テスト用バナーID
        const TEST_BANNER_ID_IOS     = 'ca-app-pub-3940256099942544/2934735716';
        const TEST_BANNER_ID_ANDROID = 'ca-app-pub-3940256099942544/6300978111';
        const platform = Capacitor.getPlatform();
        const adId = platform === 'ios' ? TEST_BANNER_ID_IOS : TEST_BANNER_ID_ANDROID;
        await AdMob.showBanner({
            adId: adId,
            adSize: 'BANNER',
            position: 'TOP_CENTER',
            margin: 0,
            isTesting: true
        });
        console.log('[AdMob] banner shown (test)');
    } catch (e) {
        console.warn('[AdMob] init failed (skip):', e && e.message);
    }
})();
</script>
